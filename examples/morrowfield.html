<title>Morrowfield · Editorial example</title>
<style>
:root{--ink:#25392f;--muted:#536356;--paper:#f7f5ee;--line:#cbd1c3;--accent:#9c4b29}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}a{color:inherit;text-underline-offset:.2em}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.skip{position:absolute;top:-100px}.skip:focus{top:8px;background:white;padding:12px;z-index:4}.notice{margin:0;background:#e3e8dc;font-size:13px;padding:9px 24px;text-align:center}header{max-width:1180px;margin:auto;padding:26px 30px;display:flex;gap:24px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:30px;font-weight:700;text-decoration:none;letter-spacing:-1px}nav{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:14px}nav [aria-current=page]{text-decoration-thickness:3px}main{max-width:1180px;margin:auto;padding:50px 30px 60px;min-height:70vh}h1,h2,h3,p{margin-top:0}h1{font:clamp(38px,5vw,64px)/1.08 Georgia,serif;letter-spacing:-1.5px;max-width:850px;margin-bottom:22px}h2{font:32px/1.2 Georgia,serif;margin-bottom:20px}h3{font:25px/1.2 Georgia,serif;margin-bottom:8px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}.intro{max-width:650px;font-size:19px;color:var(--muted)}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:25px 0}.button{display:inline-block;background:var(--ink);color:white;padding:11px 20px;text-decoration:none;border:1px solid var(--ink);border-radius:3px;font-weight:600;font-size:15px}.button.secondary{background:transparent;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px}.card{background:#fffdf7;border:1px solid var(--line);border-radius:5px;overflow:hidden}.art{height:230px;background:#e6e6d8;display:grid;place-items:center}.art.alt{background:#e3d8c8}.art svg{height:90%;max-width:100%}.card-copy{padding:24px}.meta{font-size:13px;color:var(--muted)}.feature{margin:38px 0 0;padding:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:30px}.split{display:grid;grid-template-columns:1fr 1fr;gap:50px}.split .art{height:480px;border-radius:5px}.price{font-size:26px;margin:12px 0}.specs{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--line);padding:16px 0;gap:14px;font-size:14px}.specs dt{color:var(--muted)}.specs dd{margin:0;font-weight:600}.purchase{background:#ecece3;padding:18px;border-radius:4px}.purchase p{font-size:14px;margin:8px 0 0}.purchase button{font:inherit;font-size:14px;padding:10px 14px;color:#465047;background:#e1e3dc;border:1px solid #aab1a8;border-radius:3px;cursor:not-allowed}.article{max-width:790px}.article h2{margin-top:35px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}.comparison section{padding:22px;border:1px solid var(--line);background:#fffdf7;border-radius:4px}.comparison p:last-child{margin-bottom:0}.rule{border-left:3px solid var(--accent);padding:14px 20px;background:#eee8dc}.breadcrumb{font-size:13px;margin-bottom:30px}footer{border-top:1px solid var(--line);max-width:1180px;margin:auto;padding:25px 30px;font-size:13px;color:var(--muted)}footer p{margin:5px 0}p,li,a{overflow-wrap:anywhere}ul{padding-left:23px}noscript{display:block;padding:30px}
@media(max-width:650px){header{padding:18px 20px;align-items:flex-start;gap:16px;flex-direction:column}.brand{font-size:27px}nav{gap:18px;font-size:13px}.notice{padding:8px 15px;font-size:12px}main{padding:30px 20px 40px}h1{font-size:40px;letter-spacing:-1px}.intro{font-size:17px}.grid,.split,.feature,.comparison{grid-template-columns:1fr;gap:20px}.grid{margin-top:25px}.art{height:205px}.split .art{height:240px;order:2}.split .product-copy{order:1}.feature{padding:22px 0}.actions{margin:20px 0}.card-copy{padding:20px}.article h2{font-size:28px}.specs{gap:12px}.breadcrumb{margin-bottom:22px}footer{padding:20px}.button{font-size:14px}}

<body>
<a class="skip" href="#content" id="skip">Skip to content</a><p class="notice" id="notice"></p>
<header><a class="brand" data-page="collection">Morrowfield<span aria-hidden="true">.</span></a><nav aria-label="Main" id="nav"></nav></header>
<main id="content" tabindex="-1"></main><footer id="footer"></footer>
<noscript>This local example requires JavaScript for its three editorial views. Read the accompanying morrowfield.md for the full decision record. / Cet exemple local exige JavaScript; le dossier morrowfield.md contient la décision complète.</noscript>
<script>
'use strict';
// Original, standalone editorial illustration. It does not load WordPress or Fy2Press runtime.
const params=new URLSearchParams(location.search);
const lang=params.get('lang')==='fr'?'fr':'en';
const page=['collection','product','guide'].includes(params.get('page'))?params.get('page'):'collection';
const copy={
en:{notice:'Fictional editorial example · Local data · Purchasing disabled',skip:'Skip to content',nav:'Main',collection:'The collection',product:'Stone mug',guide:'Field guide',switch:'Français',eyebrow:'Everyday, with intention',title:'A quieter start.<br>A useful companion.',intro:'Two simple objects for the pause at home and the path beyond it. Start with how you spend your morning, then choose the shape that fits.',readGuide:'Find your everyday fit',viewProduct:'Explore the Stone mug',mug:'Stone mug · 350 ml',bottle:'Trail bottle · 600 ml',mugText:'An open shape for the desk, the kitchen table and a slower first cup.',bottleText:'A closed shape for the bag, the trail and a drink between stops.',samplePrice:'CAD 24.00 · fictional price',compare:'Compare the two uses',collectionNoteTitle:'Choose the moment first.',collectionNote:'The mug suits a seated pause. The bottle suits carrying a drink. These are fictional editorial criteria, not tested durability or performance claims.',back:'Back to the collection',productEyebrow:'For the pause at home',productTitle:'A place for your<br>first cup.',productIntro:'The Stone mug is the sample choice for a drink you enjoy sitting down. Its open rim and 350 ml illustration keep the decision focused on a desk or table, rather than travel.',price:'CAD 24.00',priceNote:'Illustrative amount; no live offer or inventory.',capacity:'Illustrated capacity',finish:'Illustrated finish',finishValue:'Stone / matte',use:'Intended example use',useValue:'Desk or table',record:'Data in this example',recordValue:'Fixed local fixture',disabled:'Purchasing unavailable in this example',purchaseNote:'A real installation would need its authorized product, variant and checkout checks before enabling purchase.',productGuide:'Mug or bottle? Read the guide',detailTitle:'Why this page has its own role',detail:'The collection helps you browse. This page explains one choice. The guide compares moments of use. Each page earns its place with different editorial content.',guideEyebrow:'Field notes · 3-minute read',guideTitle:'Mug or bottle?<br>Start with your morning.',guideIntro:'Before comparing a price or a colour, think about the journey your drink makes. The useful distinction is the time spent at a table and the time spent on the move.',pauseTitle:'01 / A pause at a table',pause:'If the drink stays beside your notebook, an open mug makes the moment simple. In this example, choose the Stone mug for a seated pause. Check size, material and care instructions on a real product before deciding.',moveTitle:'02 / A drink on the move',move:'If the drink goes into a bag, a bottle may be the better starting point. Here, the Trail bottle represents that use. A closed drawing does not establish leak resistance, insulation or suitability for hot drinks.',compareTitle:'Make the difference explicit',mugFit:'Seated use, an open rim and a smaller illustrated capacity.',bottleFit:'Carried use, a closed shape and a larger illustrated capacity.',guideRule:'This guide answers a choice across products. It keeps its own editorial URL; mentioning a product does not make the guide a duplicate of that product page.',guideEnd:'Ready to make the example concrete?',guideEndText:'Explore the sample product, then return to the collection. In a real project, confirm the current specification and price at the authorized commercial destination.',footer:'Original Morrowfield example for the Fy2Press documentation · CC BY 4.0 text / MIT original code',footerScope:'An editorial composition with fictional records. No Shopify connection, cart or payment. Product shapes are original schematic illustrations.',caseLink:'Read the architecture and handover record'},
fr:{notice:'Exemple éditorial fictif · Données locales · Achat désactivé',skip:'Aller au contenu',nav:'Navigation principale',collection:'La collection',product:'Tasse Stone',guide:'Guide de choix',switch:'English',eyebrow:'Le quotidien, simplement',title:'Un début plus calme.<br>Un objet bien choisi.',intro:'Deux objets simples pour la pause à la maison et le chemin qui suit. Partez de votre matinée, puis choisissez la forme qui convient.',readGuide:'Trouver votre usage',viewProduct:'Découvrir la tasse Stone',mug:'Tasse Stone · 350 ml',bottle:'Bouteille Trail · 600 ml',mugText:'Une forme ouverte pour le bureau, la table et une première tasse sans hâte.',bottleText:'Une forme fermée pour le sac, le sentier et une boisson entre deux arrêts.',samplePrice:'24.00 CAD · prix fictif',compare:'Comparer les deux usages',collectionNoteTitle:'Choisir le moment d’abord.',collectionNote:'La tasse convient à une pause assise. La bouteille représente le transport d’une boisson. Ces critères éditoriaux fictifs ne constituent pas des essais de résistance ou de performance.',back:'Revenir à la collection',productEyebrow:'Pour la pause à la maison',productTitle:'Une place pour<br>la première tasse.',productIntro:'La tasse Stone illustre le choix d’une boisson savourée en position assise. Son bord ouvert et sa capacité illustrée de 350 ml orientent la décision vers le bureau ou la table.',price:'24.00 CAD',priceNote:'Montant illustratif ; aucune offre ni disponibilité en direct.',capacity:'Capacité illustrée',finish:'Finition illustrée',finishValue:'Stone / mate',use:'Usage de l’exemple',useValue:'Bureau ou table',record:'Données de cet exemple',recordValue:'Jeu local fixe',disabled:'Achat indisponible dans cet exemple',purchaseNote:'Une installation réelle exige ses vérifications autorisées du produit, de la variante et du paiement avant l’activation de l’achat.',productGuide:'Tasse ou bouteille ? Lire le guide',detailTitle:'Le rôle propre de cette page',detail:'La collection aide à parcourir la sélection. Cette fiche explique un choix. Le guide compare les moments d’utilisation. Chaque page apporte un contenu éditorial distinct.',guideEyebrow:'Notes de terrain · 3 minutes de lecture',guideTitle:'Tasse ou bouteille ?<br>Partez de votre matinée.',guideIntro:'Avant de comparer un prix ou une couleur, pensez au trajet de votre boisson. La distinction utile sépare le temps passé à une table du temps passé en déplacement.',pauseTitle:'01 / Une pause à une table',pause:'Si la boisson reste près de votre carnet, une tasse ouverte simplifie le moment. Cet exemple propose la tasse Stone pour une pause assise. Vérifiez les dimensions, le matériau et l’entretien du produit réel avant de choisir.',moveTitle:'02 / Une boisson en déplacement',move:'Si la boisson voyage dans un sac, une bouteille peut constituer un meilleur point de départ. La bouteille Trail représente cet usage. Un dessin fermé ne prouve ni étanchéité, ni isolation, ni compatibilité avec une boisson chaude.',compareTitle:'Rendre la différence explicite',mugFit:'Usage assis, bord ouvert et capacité illustrée plus petite.',bottleFit:'Usage en déplacement, forme fermée et capacité illustrée plus grande.',guideRule:'Ce guide répond à un choix entre plusieurs produits. Il conserve sa propre URL éditoriale ; citer un produit ne le rend pas équivalent à sa fiche.',guideEnd:'Prêt à parcourir l’exemple ?',guideEndText:'Consultez la fiche, puis revenez à la collection. Dans un vrai projet, confirmez les caractéristiques et le prix actuels à la destination commerciale autorisée.',footer:'Exemple original Morrowfield pour la documentation Fy2Press · Textes CC BY 4.0 / code original MIT',footerScope:'Composition éditoriale avec des fiches fictives. Aucune connexion Shopify, aucun panier ni paiement. Formes de produits schématiques originales.',caseLink:'Lire la décision d’architecture et la passation'}
};
const t=copy[lang];const href=(view,l=lang)=>'?page='+view+'&lang='+l;
const link=(view,label,style='button')=>`<a class="${style}" href="${href(view)}">${label}</a>`;
const mug=`<svg viewBox="0 0 420 300" role="img" aria-label="${t.mug}"><ellipse cx="204" cy="263" rx="118" ry="14" fill="#c8cebe"/><path d="M284 91h24c67 0 65 105-1 105h-23" fill="none" stroke="#a6ad98" stroke-width="24"/><path d="M108 67h180v153q0 39-41 39h-98q-41 0-41-39z" fill="#bdc4af"/><ellipse cx="198" cy="67" rx="90" ry="18" fill="#8f9a80"/><ellipse cx="198" cy="69" rx="72" ry="9" fill="#544b36"/><path d="M137 102v100q0 27 20 29" fill="none" stroke="#dce0cd" stroke-width="9" stroke-linecap="round"/></svg>`;
const bottle=`<svg viewBox="0 0 420 300" role="img" aria-label="${t.bottle}"><ellipse cx="210" cy="268" rx="85" ry="12" fill="#c5b8a4"/><rect x="172" y="25" width="76" height="38" rx="10" fill="#46594e"/><path d="M174 61h72v27q35 15 35 49v97q0 30-30 30h-82q-30 0-30-30v-97q0-34 35-49z" fill="#a8b5a0"/><path d="M174 119v105" stroke="#dbe2d0" stroke-width="10" stroke-linecap="round"/><path d="M151 166h118" stroke="#778c75" stroke-width="2"/></svg>`;
document.documentElement.lang=lang==='fr'?'fr-CA':'en';document.title='Morrowfield · '+t[page];
document.getElementById('notice').textContent=t.notice;document.getElementById('skip').textContent=t.skip;
document.querySelector('.brand').href=href('collection');document.getElementById('nav').setAttribute('aria-label',t.nav);
document.getElementById('nav').innerHTML=['collection','product','guide'].map(v=>`<a href="${href(v)}" ${v===page?'aria-current="page"':''}>${t[v]}</a>`).join('')+`<a href="${href(page,lang==='en'?'fr':'en')}" lang="${lang==='en'?'fr':'en'}">${t.switch}</a>`;
const views={
collection:`<p class="eyebrow">${t.eyebrow}</p><h1>${t.title}</h1><p class="intro">${t.intro}</p><div class="actions">${link('guide',t.readGuide)}${link('product',t.viewProduct,'button secondary')}</div><div class="grid"><section class="card"><div class="art">${mug}</div><div class="card-copy"><p class="meta">01 / Morrowfield</p><h2>${t.mug}</h2><p>${t.mugText}</p><p class="meta">${t.samplePrice}</p>${link('product',t.viewProduct,'text-link')}</div></section><section class="card"><div class="art alt">${bottle}</div><div class="card-copy"><p class="meta">02 / Morrowfield</p><h2>${t.bottle}</h2><p>${t.bottleText}</p><p class="meta">${t.samplePrice}</p>${link('guide',t.compare,'text-link')}</div></section></div><aside class="feature"><h2>${t.collectionNoteTitle}</h2><p>${t.collectionNote}</p></aside>`,
product:`<p class="breadcrumb">${link('collection','← '+t.back,'text-link')}</p><div class="split"><div class="art">${mug}</div><div class="product-copy"><p class="eyebrow">${t.productEyebrow}</p><h1>${t.productTitle}</h1><p>${t.productIntro}</p><p class="price">${t.price}</p><p class="meta">${t.priceNote}</p><dl class="specs"><div><dt>${t.capacity}</dt><dd>350 ml</dd></div><div><dt>${t.finish}</dt><dd>${t.finishValue}</dd></div><div><dt>${t.use}</dt><dd>${t.useValue}</dd></div><div><dt>${t.record}</dt><dd>${t.recordValue}</dd></div></dl><div class="actions">${link('guide',t.productGuide)}</div><div class="purchase"><button disabled>${t.disabled}</button><p>${t.purchaseNote}</p></div></div></div><aside class="feature"><h2>${t.detailTitle}</h2><p>${t.detail}</p></aside>`,
guide:`<article class="article"><p class="eyebrow">${t.guideEyebrow}</p><h1>${t.guideTitle}</h1><p class="intro">${t.guideIntro}</p><div class="actions">${link('product',t.viewProduct)}${link('collection',t.collection,'button secondary')}</div><h2>${t.pauseTitle}</h2><p>${t.pause}</p><h2>${t.moveTitle}</h2><p>${t.move}</p><h2>${t.compareTitle}</h2><div class="comparison"><section><h3>${t.mug}</h3><p>${t.mugFit}</p></section><section><h3>${t.bottle}</h3><p>${t.bottleFit}</p></section></div><p class="rule">${t.guideRule}</p><h2>${t.guideEnd}</h2><p>${t.guideEndText}</p><div class="actions">${link('product',t.viewProduct)}${link('collection',t.back,'button secondary')}</div></article>`
};document.getElementById('content').innerHTML=views[page];
const casePath=lang==='fr'?'../fr-ca/examples/morrowfield.md':'morrowfield.md';
document.getElementById('footer').innerHTML=`<p>${t.footer}</p><p>${t.footerScope}</p><p><a href="${casePath}">${t.caseLink}</a></p>`;
</script>
</body></html>
