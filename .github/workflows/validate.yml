name: Documentation validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-14
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reference.py check
      - run: python scripts/reference.py generate --check
      - run: python -B -m unittest discover -s tests
      - run: python scripts/reference.py export-public --dry-run
