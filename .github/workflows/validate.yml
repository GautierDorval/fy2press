name: Documentation validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-10-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-10-14
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reference.py check
      - run: python scripts/reference.py generate --check
      - run: python -B -m unittest discover -s tests
      - run: python scripts/reference.py export-public --dry-run
